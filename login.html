<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ProfileQR AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Profile<span>QR</span> AI
        </div>

        <a href="index.html" class="nav-button">
            ← Back to Home
        </a>

    </nav>


    <section class="digital-profile">

        <div class="profile-card">

            <h1>Welcome to ProfileQR AI</h1>

            <p>
                Login or create a new account to manage
                your professional digital profile.
            </p>


            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >


            <button
                type="button"
                id="loginButton"
                class="download-btn"
            >
                Login
            </button>


            <button
                type="button"
                id="registerButton"
                class="download-btn"
            >
                Create New Account
            </button>


            <p id="loginMessage"></p>

        </div>

    </section>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <!-- Main JavaScript -->

    <script src="script.js"></script>

</body>

</html>
