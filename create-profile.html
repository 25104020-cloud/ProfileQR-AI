<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Profile | ProfileQR AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            Profile<span>QR</span> AI
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </nav>


    <!-- Profile Form -->
    <section class="profile-page">

        <div class="form-container">

            <div class="form-header">
                <p class="badge">CREATE YOUR DIGITAL IDENTITY</p>

                <h1>Build Your Professional Profile</h1>

                <p>
                    Add your information and create a professional
                    digital identity that can be shared with one QR code.
                </p>
            </div>


            <form id="profileForm">
                <div class="form-group">
    <label for="profilePhoto">Profile Photo</label>
    <input type="file" id="profilePhoto" accept="image/*">
</div>
<div class="form-group">
    <label for="resume">Upload Resume (PDF)</label>
    <input type="file" id="resume" accept=".pdf">
</div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Professional Title</label>
                    <input type="text" id="title"
                        placeholder="Example: CSE Student | Web Developer">
                </div>
                <div class="form-group">
   <div class="form-group">
    <label>About Me</label>

    <textarea id="bio" placeholder="Tell us briefly about yourself, your interests and goals"></textarea>

    <button type="button" class="ai-btn" onclick="testBio()">
        ✨ Generate AI Bio
    </button>
</div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email"
                        placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone"
                        placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label>Education</label>
                    <textarea id="education"
                        placeholder="Example: B.E. Computer Science and Engineering"></textarea>
                </div>

                <div class="form-group">
                    <label>Skills</label>
                    <input type="text" id="skills"
                        placeholder="Example: C++, HTML, CSS, JavaScript">
                </div>

                <div class="form-group">
                    <label>Projects</label>
                    <textarea id="projects"
                        placeholder="Describe your projects"></textarea>
                </div>
                <div class="form-group">
    <label for="achievements">Achievements & Certificates</label>

    <textarea id="achievements"
        placeholder="Example: First Prize in Debate Competition, SoloLearn C Programming Certificate, SkillRack Array Certificate"></textarea>
</div>

                <div class="form-group">
                    <label>LinkedIn URL</label>
                    <input type="url" id="linkedin"
                        placeholder="https://linkedin.com/in/yourname">
                </div>

                <div class="form-group">
                    <label>GitHub URL</label>
                    <input type="url" id="github"
                        placeholder="https://github.com/yourusername">
                </div>

                <button type="submit" class="primary-btn form-btn">
                    Generate My Profile →
                </button>

            </form>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
